services:
  - type: web
    name: promptcraft-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AUTO_OPEN_BROWSER
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_HOSTS
        value: promptcraft-hub.onrender.com
      - key: CORS_ORIGINS
        value: https://promptcraft-hub.onrender.com
      - key: SECRET_KEY
        generateValue: true
